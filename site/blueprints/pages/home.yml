title: Home
icon: home

tabs:
  # Content
  content:
    label: Content
    icon: text
    columns:
      main:
        width: 2/3
        fields:
          hero_image:
            label: Hero Image
            type: files
            max: 1
            layout: cards

          hero_title:
            label: Hero Title
            type: text

          hero_subtitle:
            label: Hero Subtitle
            type: text
          
          page_builder:
            label: Page sections
            type: blocks
            fieldsets:
              - blurbs
              - paragraph
              - zigzag
              - testimonials
              - latest_projects
              - cta
      
      sidebar:
        width: 1/3
        sections:
          files:
            type: files
            headline: Media library
            layout: list

  # SEO
  seo:
    label: SEO
    icon: search
    columns:
      main:
        width: 2/3
        fields:
          metaTitle:
            label: Meta Title
            type: text
            help: If left empty, the page title will be used.
            icon: title

          metaDescription:
            label: Meta Description
            type: textarea
            buttons: false
            maxlength: 160
            help: Summarize the page content in less than 160 characters.

          seoLine:
            type: line

          ogImage:
            label: Social Media Image (Open Graph)
            type: files
            max: 1
            layout: cards
            help: Image that will appear when sharing the link on WhatsApp, Facebook or X.

      sidebar:
        width: 1/3
        sections:
          seo_tips:
            type: info
            headline: SEO Tips
            text: |
              1. Use **keywords** in the title.
              2. The **description** should be engaging to generate clicks.
              3. Don't forget to upload an **OG Image** of 1200x630px.